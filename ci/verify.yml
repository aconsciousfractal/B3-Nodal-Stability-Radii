name: Verify paper and companion

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.14'
      - name: Verify the distributed files
        run: python -B scripts/verify.py
      - name: Install the companion dependencies
        run: python -m pip install -r companion/requirements.txt
      - name: Compare both examples in normal and optimized Python
        run: python -B scripts/verify.py --replay
